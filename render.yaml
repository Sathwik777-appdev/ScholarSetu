databases:
  - name: scholarsetu-db
    databaseName: scholarsetu
    user: scholarsetu
    plan: free

services:
  - type: web
    name: scholarsetu-api
    env: docker
    dockerfilePath: ./services/core/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholarsetu-db
          property: connectionString
      - key: JWT_SECRET
        value: 95b05923d4da1751befc1bdc5d2429838f3a13fdd212425cad92eee1a3fddd83
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_OTP
        value: "123456"
      - key: OUTBOX_PUBLISHER_ENABLED
        value: "false"
      - key: ADAPTER_SYNC_INTERVAL_SECONDS
        value: "0"
      - key: RETENTION_INTERVAL_SECONDS
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://console-khaki-two.vercel.app,http://localhost:5173,http://localhost:8000"
      - key: PPRL_HMAC_KEY
        value: "44d3887302f1d4ca4de6253cbeed5a78f037628cfc4b130d335432de6ac207d7"
      - key: SMS_GATEWAY_TOKEN
        value: "b010ffee3e5ff85e21dafc346ba2b527a14fa4fcbb913fbb"
