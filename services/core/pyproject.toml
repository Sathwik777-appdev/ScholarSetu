[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarsetu-core"
version = "0.1.0"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "PyJWT[crypto]>=2.8",
    "python-multipart",
    "nats-py",
    "redis[hiredis]",
    "cryptography",
    "PyNaCl",
    "rapidfuzz",
    "indic-transliteration",
    "httpx",
    "structlog",
    "python-json-logger",
    "tenacity",
    "faker"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]
