# SFMP status vocabulary -> ScholarSetu canonical lifecycle (ARCHITECTURE.md §6.2.2).
# Codes are illustrative until confirmed with the portal owner. Unknown codes are parked, never guessed.
source: SFMP
states:
  NEW: DRAFT
  APPLIED: SUBMITTED
  INST_VERIF_PENDING: INSTITUTE_VERIFICATION
  CLARIFICATION_REQ: DEFICIENCY_RAISED
  CLARIFICATION_RECV: RESUBMITTED
  DISTRICT_VERIF_PENDING: AUTHORITY_VERIFICATION
  STATE_VERIF_PENDING: AUTHORITY_VERIFICATION
  SANCTION_GENERATED: SANCTIONED
  REJECTED_BY_DISTRICT: REJECTED
  REJECTED_BY_STATE: REJECTED
  DBT_INITIATED: PAYMENT_INITIATED
  DBT_SUCCESS: CREDITED
  DBT_FAILED: PAYMENT_FAILED
  ELIGIBLE_RENEWAL: RENEWAL_DUE
payment_states:
  DBT_INITIATED: INITIATED
  DBT_SUCCESS: CREDITED
  DBT_FAILED: FAILED
unknown_state_policy: park_and_alert
