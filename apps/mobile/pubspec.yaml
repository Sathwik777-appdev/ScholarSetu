name: scholarsetu_mobile
description: "ScholarSetu student and family app (MoTA scholarships)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  drift: ^2.35.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sqlite3: ^3.6.0
  url_launcher: ^6.3.3
  flutter_web_auth_2: ^4.0.0
  uuid: ^4.6.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Hindi (Devanagari), bundled so Hindi renders on every phone. SIL Open Font License (assets/fonts/NotoSansDevanagari-OFL.txt).
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

# The local database is encrypted with SQLCipher, built by package:sqlite3's native-assets hook.
# (sqlcipher_flutter_libs is end-of-life for sqlite3 3.x.) The app refuses to open the cache if
# `PRAGMA cipher_version` shows the library is not SQLCipher.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
