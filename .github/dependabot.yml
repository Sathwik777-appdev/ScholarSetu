# Weekly update pull requests for every dependency manifest; security updates arrive as soon as published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/core
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /mocks
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /deploy/gcp/power-manager
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /apps/console
    schedule: {interval: weekly}
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
