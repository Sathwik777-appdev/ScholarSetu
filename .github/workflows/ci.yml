name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.16"
      - run: ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholarsetu
          POSTGRES_PASSWORD: scholarsetu_dev
          POSTGRES_DB: scholarsetu
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U scholarsetu" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://scholarsetu:scholarsetu_dev@localhost:5434/scholarsetu_test
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements*
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      # NATS with JetStream for the outbox test (a service container cannot be given the -js flag).
      - run: docker run -d --name nats -p 4223:4222 nats:2.10-alpine -js
      - run: pip install -r services/core/requirements-dev.txt
      - run: pytest -q

  dependency-audit:
    # Known vulnerabilities in what the images install (the lock files) and in the console's runtime packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --no-deps --disable-pip -r services/core/requirements.lock -r mocks/requirements.lock -r deploy/gcp/power-manager/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: apps/console

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  smoke:
    # The eight demo scenes against the real stack (docker compose), freshly seeded.
    runs-on: ubuntu-latest
    needs: [lint, backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with fresh secrets (demo mode) and the signing key
        run: |
          python3 scripts/make_env.py --demo
          make keys
      - name: Start the stack
        run: docker compose --env-file .env -f infra/docker-compose.yml up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:8000/health/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Seed the demo world
        run: docker compose --env-file .env -f infra/docker-compose.yml exec -T core python /scripts/seed_demo.py
      - name: Smoke test (all 8 scenes, content-checked)
        run: |
          set -a; . ./.env; set +a
          SMOKE_BASE_URL=http://localhost:8000 python3 scripts/demo_smoke_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail 200
