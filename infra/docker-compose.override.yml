services:
  core:
    volumes:
      - ../services/core:/app
      - ../scripts:/scripts:ro
      - ../rules:/rules:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  mock-services:
    volumes:
      - ../mocks:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8100 --reload
